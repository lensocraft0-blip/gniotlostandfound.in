<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30152F"/>
      <stop offset="100%" stop-color="#1D1020"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C35C"/>
      <stop offset="100%" stop-color="#D9A441"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E8EDF2"/>
      <stop offset="100%" stop-color="#BFC8D2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Badge -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Rim -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.45"/>
  
  <!-- Inner Shield / Compass Geometry -->
  <g transform="translate(256, 256)">
    <!-- Radar / Scan Rings -->
    <circle r="160" fill="none" stroke="#E8EDF2" stroke-width="2" opacity="0.12" stroke-dasharray="8 6"/>
    <circle r="120" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.3"/>
    <circle r="80" fill="none" stroke="#E8EDF2" stroke-width="2" opacity="0.2"/>
    
    <!-- Shield Outline -->
    <path d="M 0 -130 L 105 -75 C 105 50, 60 115, 0 145 C -60 115, -105 50, -105 -75 Z" 
          fill="none" stroke="url(#silverGrad)" stroke-width="8" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Central Golden Beacon / Pin -->
    <path d="M 0 -70 C -32 -70, -52 -46, -52 -18 C -52 24, 0 80, 0 80 C 0 80, 52 24, 52 -18 C 52 -46, 32 -70, 0 -70 Z" 
          fill="url(#goldGrad)"/>
    
    <!-- Core Spark / Magnifier Aperture -->
    <circle cx="0" cy="-20" r="18" fill="#1D1020"/>
    <circle cx="0" cy="-20" r="10" fill="url(#silverGrad)"/>
    
    <!-- Compass Pointer Lines -->
    <line x1="0" y1="-145" x2="0" y2="-125" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="125" x2="0" y2="145" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="-145" y1="0" x2="-125" y2="0" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="125" y1="0" x2="145" y2="0" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
